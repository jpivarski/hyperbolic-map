<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stress harness</title>
<style>body{font:12px ui-monospace,monospace;margin:8px}canvas{border:1px solid #ccc}</style>
</head>
<body>
<div id="map"></div>
<pre id="log"></pre>

<script src="../dist/hyperbolic-map.iife.js"></script>
<script>
// Stress harness for drawing correctness. The organising idea is PATH INDEPENDENCE: the picture must
// depend only on the current view, never on how the view was reached. Any difference between a view
// reached by scrolling and the same view constructed fresh is a state bug -- exactly the "polygons
// disappear after interaction" class.
//
// Images are compared on a DOWNSAMPLED signature rather than exact pixels, because Chrome switches a
// canvas between software and GPU rasterization and the two antialias differently (see
// notes/canvas-testing.md). Downsampling averages that away while still catching a missing polygon.

const H = window.HyperbolicMap;
let vp = null;

window.build = function (opts) {
  if (vp) vp.destroy();
  document.getElementById("map").innerHTML = "";
  vp = new H.HyperbolicViewport(
    Object.assign({ container: "#map", width: 420, height: 420, devicePixelRatio: 1 }, opts),
  );
  window.vp = vp;
  return vp.stats.drawables;
};

const N = 42;
window.signature = function () {
  const c = document.querySelector("#map canvas");
  const w = c.width, h = c.height;
  const d = c.getContext("2d").getImageData(0, 0, w, h).data;
  const acc = new Float64Array(N * N * 3);
  const cnt = new Float64Array(N * N);
  for (let y = 0; y < h; y++) {
    const gy = Math.min(N - 1, Math.floor((y / h) * N));
    for (let x = 0; x < w; x++) {
      const gx = Math.min(N - 1, Math.floor((x / w) * N));
      const i = (y * w + x) * 4;
      const g = gy * N + gx;
      // Composite against mid-grey so transparent and opaque are distinguishable.
      const a = d[i + 3] / 255;
      acc[g * 3] += d[i] * a + 128 * (1 - a);
      acc[g * 3 + 1] += d[i + 1] * a + 128 * (1 - a);
      acc[g * 3 + 2] += d[i + 2] * a + 128 * (1 - a);
      cnt[g]++;
    }
  }
  const out = new Array(N * N * 3);
  for (let g = 0; g < N * N; g++) {
    out[g * 3] = acc[g * 3] / cnt[g];
    out[g * 3 + 1] = acc[g * 3 + 1] / cnt[g];
    out[g * 3 + 2] = acc[g * 3 + 2] / cnt[g];
  }
  return out;
};

window.compare = function (a, b) {
  let worst = 0, sum = 0, worstAt = -1;
  for (let i = 0; i < a.length; i++) {
    const d = Math.abs(a[i] - b[i]);
    if (d > worst) { worst = d; worstAt = i; }
    sum += d;
  }
  return { worst: +worst.toFixed(2), mean: +(sum / a.length).toFixed(3), cell: Math.floor(worstAt / 3) };
};

window.frame = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

window.setView = async function (cx, cy, zoom, rotation) {
  // panTo is GLOBAL and stays correct here: this harness builds single-patch viewports, and in atlas
  // mode it would throw rather than mislead once the camera left the origin tile.
  vp.panTo(cx, cy);
  vp.setZoom(zoom);
  vp.setRotation(rotation);
  vp.render();
  await window.frame();
};

window.pointer = function (type, x, y, extra) {
  const c = document.querySelector("#map canvas");
  const rect = c.getBoundingClientRect();
  c.dispatchEvent(new PointerEvent(type, Object.assign({
    pointerId: 1, pointerType: "mouse", button: 0,
    buttons: type === "pointerup" ? 0 : 1,
    clientX: rect.left + x, clientY: rect.top + y, bubbles: true, cancelable: true,
  }, extra || {})));
};

window.drag = async function (x0, y0, x1, y1, steps) {
  steps = steps || 5;
  window.pointer("pointerdown", x0, y0);
  await window.frame();
  for (let i = 1; i <= steps; i++) {
    window.pointer("pointermove", x0 + (x1 - x0) * i / steps, y0 + (y1 - y0) * i / steps);
    await window.frame();
  }
  window.pointer("pointerup", x1, y1);
  await window.frame();
};

window.wheel = async function (x, y, deltaY, times) {
  const c = document.querySelector("#map canvas");
  const rect = c.getBoundingClientRect();
  for (let i = 0; i < (times || 1); i++) {
    c.dispatchEvent(new WheelEvent("wheel", {
      clientX: rect.left + x, clientY: rect.top + y, deltaY, deltaMode: 0,
      bubbles: true, cancelable: true,
    }));
    await window.frame();
  }
};

window.viewOf = function () {
  const v = vp.getView();
  return { cx: v.center[0], cy: v.center[1], zoom: v.zoom, rotation: v.rotation };
};

window.stats = function () {
  return {
    drawables: vp.stats.drawables, drawn: vp.stats.drawn,
    survivors: vp.stats.survivors, textDrawn: vp.stats.textDrawn,
    canvasCalls: vp.stats.canvasCalls,
  };
};

window.shoot = async function (name) {
  const url = document.querySelector("#map canvas").toDataURL("image/png");
  await fetch(`/__shot/${name}.png`, { method: "POST", body: url });
};
</script>
</body>
</html>
